name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build ./cmd/cdp-exporter
      - name: alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus":/r -w /r --entrypoint promtool prom/prometheus:v3.7.3 check rules alerts.yml
          docker run --rm -v "$PWD/deploy/prometheus":/r -w /r --entrypoint promtool prom/prometheus:v3.7.3 test rules alerts_test.yml
      - name: dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/cdp-exporter.json >/dev/null
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: ./test/e2e/run.sh
  kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: ./test/kind/run.sh
